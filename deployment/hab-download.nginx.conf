# Add inside the existing HTTPS server block for hab.rapal.tech.
# This serves public static packages only; never proxy the demo execution server.
# The parent server uses Basic Auth for the Harmony Control Room, so the public
# download locations explicitly disable inherited Basic Auth and nothing else.
location = /download {
    auth_basic off;
    return 308 /download/;
}

location ^~ /download/ {
    auth_basic off;
    root /var/www/harmony-downloads;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
}
